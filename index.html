<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>博瀚英文單字卡</title>
    <style>
        body { background-color: #121212; color: white; font-family: "Microsoft JhengHei", sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { background-color: #1e1e1e; padding: 30px; border-radius: 20px; width: 90%; max-width: 500px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h2 { margin-top: 0; font-weight: normal; letter-spacing: 2px; }
        
        /* 照片中的藍色外框 */
        .image-box { border: 2px solid #3498db; border-radius: 15px; width: 100%; aspect-ratio: 16 / 10; margin: 20px 0; display: flex; justify-content: center; align-items: center; overflow: hidden; position: relative; }
        .image-box img { width: 100%; height: 100%; object-fit: cover; }
        
        /* 選項按鈕區（對應您提到的測驗功能） */
        .options { display: grid; gap: 10px; margin-bottom: 20px; }
        .option-btn { background-color: #333; color: white; border: 1px solid #444; padding: 12px; border-radius: 10px; cursor: pointer; transition: 0.2s; font-size: 18px; }
        .option-btn:hover { background-color: #444; border-color: #3498db; }

        /* 照片中的藍色控制按鈕 */
        .nav-buttons { display: flex; justify-content: center; gap: 20px; margin-top: 20px; }
        .nav-btn { background-color: #3498db; color: white; border: none; padding: 12px 30px; border-radius: 25px; font-size: 18px; cursor: pointer; min-width: 120px; }
        .nav-btn:disabled { background-color: #555; cursor: not-allowed; }

        .footer { margin-top: 30px; font-size: 12px; color: #888; border-top: 1px solid #333; padding-top: 15px; }
    </style>
</head>
<body>

<div class="container">
    <h2>博瀚英文單字卡</h2>
    
    <div class="image-box">
        <img id="word-image" src="" alt="單字圖示">
    </div>

    <div id="options-container" class="options"></div>

    <div id="feedback" style="height: 25px; margin-bottom: 10px; font-weight: bold;"></div>

    <div class="nav-buttons">
        <button id="prev-btn" class="nav-btn" onclick="changeQuestion(-1)">上一題</button>
        <button id="next-btn" class="nav-btn" onclick="changeQuestion(1)">下一題</button>
    </div>

    <div class="footer">
        博瀚文理曾益慧老師整理
    </div>
</div>

<script>
    // 這裡對應您在試算表上的資料
    const wordBank = [
        { en: "apple", zh: "蘋果" },
        { en: "cat", zh: "貓" }
    ];

    let currentIndex = 0;

    function loadCard() {
        const word = wordBank[currentIndex];
        const img = document.getElementById('word-image');
        const optionsContainer = document.getElementById('options-container');
        const feedback = document.getElementById('feedback');
        
        // 1. 更新圖片：從網路圖庫根據單字自動抓取 (400x300解析度)
        img.src = `https://images.unsplash.com/photo-1512132411229-c30391241dd8?q=80&w=400&auto=format&fit=crop`; // 預設 loading 圖
        img.src = `https://source.unsplash.com/400x300/?${word.en}`;

        // 2. 清除回饋
        feedback.innerText = "";
        optionsContainer.innerHTML = "";

        // 3. 建立三個選項 (正確答案 + 從銀行亂數抓兩個錯誤的)
        let options = [word.en];
        // 這裡示範如果單字庫太少，先補齊三個選項
        if (wordBank.length < 3) {
            options.push("dog", "banana");
        }
        options.sort(() => Math.random() - 0.5);

        options.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = "option-btn";
            btn.innerText = opt;
            btn.onclick = () => checkAnswer(opt, word.en);
            optionsContainer.appendChild(btn);
        });

        // 4. 更新按鈕狀態
        document.getElementById('prev-btn').disabled = (currentIndex === 0);
        document.getElementById('next-btn').disabled = (currentIndex === wordBank.length - 1);
    }

    function checkAnswer(selected, correct) {
        const feedback = document.getElementById('feedback');
        if (selected === correct) {
            feedback.innerText = "⭕ 正確！Excellent!";
            feedback.style.color = "#2ecc71";
            // 語音回饋：老師希望有聲音
            const msg = new SpeechSynthesisUtterance(correct);
            msg.lang = 'en-US';
            window.speechSynthesis.speak(msg);
        } else {
            feedback.innerText = "❌ 再試一次喔！";
            feedback.style.color = "#e74c3c";
        }
    }

    function changeQuestion(step) {
        currentIndex += step;
        loadCard();
    }

    // 初始化第一題
    loadCard();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>博瀚英文單字卡 - 自動同步版</title>
    <style>
        /* 延續老師照片中的深色質感風格 */
        body { background-color: #121212; color: white; font-family: "Microsoft JhengHei", sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { background-color: #1e1e1e; padding: 30px; border-radius: 20px; width: 90%; max-width: 500px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .image-box { border: 2px solid #3498db; border-radius: 15px; width: 100%; aspect-ratio: 16 / 10; margin: 20px 0; display: flex; justify-content: center; align-items: center; overflow: hidden; background: #252525; }
        .image-box img { width: 100%; height: 100%; object-fit: cover; }
        .options { display: grid; gap: 10px; margin-bottom: 20px; }
        .option-btn { background-color: #333; color: white; border: 1px solid #444; padding: 12px; border-radius: 10px; cursor: pointer; font-size: 18px; }
        .option-btn:hover { border-color: #3498db; background-color: #252525; }
        .nav-buttons { display: flex; justify-content: center; gap: 20px; }
        .nav-btn { background-color: #3498db; color: white; border: none; padding: 12px 30px; border-radius: 25px; font-size: 18px; cursor: pointer; }
        .footer { margin-top: 30px; font-size: 12px; color: #888; border-top: 1px solid #333; padding-top: 15px; }
    </style>
</head>
<body>

<div class="container" id="app">
    <h2 id="level-title">博瀚英文單字卡</h2>
    <div id="loading">讀取雲端單字庫中...</div>
    
    <div id="main-content" style="display:none;">
        <div class="image-box">
            <img id="word-image" src="" alt="單字圖">
        </div>
        <div id="options-container" class="options"></div>
        <div id="feedback" style="height:30px; margin-bottom:10px;"></div>
        <div class="nav-buttons">
            <button class="nav-btn" onclick="changeQuestion(-1)">上一題</button>
            <button class="nav-btn" onclick="changeQuestion(1)">下一題</button>
        </div>
    </div>

    <div class="footer">博瀚文理曾益慧老師整理</div>
</div>

<script>
    // ⚠️ 請在此處貼上您從「發佈到網路」複製的 CSV 網址
    const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vR_JxaWoXffkQ7vVZM27GUkl8Q0H6v4zyPr9go3_1_3O3ReFeaJNWqUgk3lYLSYw8b0WALK9OwMGYgk/pub?output=csv'; 

    let wordBank = [];
    let currentIndex = 0;

    // 從 Google 試算表抓取資料
    async function fetchSheetData() {
        try {
            const response = await fetch(csvUrl);
            const data = await response.text();
            const rows = data.split('\n').slice(1); // 跳過第一行標題
            
            wordBank = rows.map(row => {
                const cols = row.split(',');
                return { en: cols[0]?.trim(), zh: cols[1]?.trim() };
            }).filter(item => item.en); // 過濾掉空行

            document.getElementById('loading').style.display = 'none';
            document.getElementById('main-content').style.display = 'block';
            loadQuestion();
        } catch (error) {
            document.getElementById('loading').innerText = '讀取失敗，請確認試算表已發佈。';
        }
    }

    function loadQuestion() {
        const word = wordBank[currentIndex];
        const img = document.getElementById('word-image');
        const container = document.getElementById('options-container');
        const feedback = document.getElementById('feedback');
        
        feedback.innerText = "";
        container.innerHTML = "";

        // 自動抓取網路圖庫圖片
        img.src = `https://source.unsplash.com/400x300/?${word.en}`;

        // 產生選項
        let options = [word.en];
        // 從單字庫隨機挑兩個錯誤答案
        let pool = wordBank.filter(w => w.en !== word.en);
        pool.sort(() => Math.random() - 0.5);
        if(pool[0]) options.push(pool[0].en);
        if(pool[1]) options.push(pool[1].en);
        
        options.sort(() => Math.random() - 0.5);

        options.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = "option-btn";
            btn.innerText = opt;
            btn.onclick = () => {
                if(opt === word.en) {
                    feedback.innerText = "⭕ Correct!";
                    feedback.style.color = "#2ecc71";
                    window.speechSynthesis.speak(new SpeechSynthesisUtterance(word.en));
                } else {
                    feedback.innerText = "❌ Try again!";
                    feedback.style.color = "#e74c3c";
                }
            };
            container.appendChild(btn);
        });
    }

    function changeQuestion(step) {
        currentIndex = (currentIndex + step + wordBank.length) % wordBank.length;
        loadQuestion();
    }

    fetchSheetData();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>博瀚英文單字卡 - 曾老師指定圖版</title>
    <style>
        /* 延續老師照片中的深色質感風格 */
        body { background-color: #121212; color: white; font-family: "Microsoft JhengHei", sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { background-color: #1e1e1e; padding: 30px; border-radius: 20px; width: 90%; max-width: 500px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h2 { margin-top: 0; font-weight: normal; letter-spacing: 2px; color: #eee; }
        
        /* 圖片容器：藍色外框 */
        .image-box { border: 2px solid #3498db; border-radius: 15px; width: 100%; aspect-ratio: 16 / 10; margin: 20px 0; display: flex; justify-content: center; align-items: center; overflow: hidden; background: #252525; position: relative; }
        .image-box img { width: 100%; height: 100%; object-fit: cover; transition: opacity 0.3s; }
        .loading-text { position: absolute; color: #555; }

        /* 選項按鈕 */
        .options { display: grid; gap: 12px; margin-bottom: 20px; }
        .option-btn { background-color: #333; color: white; border: 1px solid #444; padding: 15px; border-radius: 10px; cursor: pointer; font-size: 18px; transition: 0.2s; }
        .option-btn:hover { border-color: #3498db; background-color: #252525; }
        .option-btn:active { transform: scale(0.98); }

        /* 下方導覽按鈕 */
        .nav-buttons { display: flex; justify-content: center; gap: 20px; margin-top: 10px; }
        .nav-btn { background-color: #555; color: white; border: none; padding: 12px 30px; border-radius: 25px; font-size: 16px; cursor: pointer; min-width: 100px; }
        .nav-btn.active { background-color: #3498db; }
        
        #feedback { height: 30px; margin-bottom: 10px; font-weight: bold; font-size: 20px; }
        .footer { margin-top: 30px; font-size: 12px; color: #888; border-top: 1px solid #333; padding-top: 15px; }
    </style>
</head>
<body>

<div class="container">
    <h2>博瀚英文單字卡</h2>
    
    <div id="loading-screen">讀取雲端單字庫中...</div>

    <div id="main-content" style="display:none;">
        <div class="image-box">
            <span class="loading-text">圖片載入中...</span>
            <img id="word-image" src="" alt="單字圖" onload="this.style.opacity=1" style="opacity:0">
        </div>

        <div id="options-container" class="options"></div>

        <div id="feedback"></div>

        <div class="nav-buttons">
            <button id="prev-btn" class="nav-btn" onclick="changeQuestion(-1)">上一題</button>
            <button id="next-btn" class="nav-btn active" onclick="changeQuestion(1)">下一題</button>
        </div>
    </div>

    <div class="footer">博瀚文理曾益慧老師整理</div>
</div>

<script>
    // ⚠️ 請在此貼上您的 CSV 網址
    const csvUrl = '您的CSV網址貼在這裡'; 

    let wordBank = [];
    let currentIndex = 0;

    async function fetchSheetData() {
        try {
            const response = await fetch(csvUrl);
            const data = await response.text();
            // 解析 CSV，處理換行與空格
            const rows = data.split(/\r?\n/).slice(1); 
            
            wordBank = rows.map(row => {
                const cols = row.split(',');
                // ★ 關鍵修正：將 C 欄 (cols[2]) 的圖片網址也解析出來
                return { 
                    en: cols[0]?.trim(), 
                    zh: cols[1]?.trim(),
                    customImg: cols[2]?.trim() // 新增這一行來儲存 C 欄網址
                };
            }).filter(item => item.en && item.en.length > 1);

            if(wordBank.length > 0) {
                document.getElementById('loading-screen').style.display = 'none';
                document.getElementById('main-content').style.display = 'block';
                loadQuestion();
            } else {
                document.getElementById('loading-screen').innerText = '試算表內沒有單字資料。';
            }
        } catch (error) {
            document.getElementById('loading-screen').innerText = '讀取失敗，請檢查網址與網路連線。';
        }
    }

    // ★ 新增一個將 Unsplash 相片頁面網址轉換為可以直接顯示的圖片網址的函數
    function convertUnsplashUrl(url) {
        if (!url || !url.includes('unsplash.com/photos/')) return url;
        const photoId = url.split('/photos/')[1].split('?')[0]; // 取出相片 ID
        return `https://images.unsplash.com/photo-${photoId}?auto=format&fit=crop&w=500&h=350&q=80`;
    }

    function loadQuestion() {
        const word = wordBank[currentIndex];
        const img = document.getElementById('word-image');
        const container = document.getElementById('options-container');
        const feedback = document.getElementById('feedback');
        
        feedback.innerText = "";
        container.innerHTML = "";
        img.style.opacity = 0; // 切換時先隱藏舊圖

        // ★ 關鍵修正：直接讀取您在 C 欄貼上的網址
        // 並使用轉換函數確保圖片能正確顯示
        if (word.customImg) {
            img.src = convertUnsplashUrl(word.customImg);
        } else {
            // 如果某個單字沒有給 C 欄網址，則使用備用方案
            img.src = `https://loremflickr.com/500/350/${word.en}?lock=${Math.random()}`;
        }

        // 選項邏輯：正確答案 + 兩個亂數錯誤答案
        let choices = [word.en];
        let otherWords = wordBank.filter(w => w.en !== word.en);
        otherWords.sort(() => Math.random() - 0.5);
        
        if(otherWords[0]) choices.push(otherWords[0].en);
        if(otherWords[1]) choices.push(otherWords[1].en);
        
        // 只有一個單字時的防錯補位
        while(choices.length < 3) choices.push("---");

        choices.sort(() => Math.random() - 0.5);

        choices.forEach(text => {
            const btn = document.createElement('button');
            btn.className = "option-btn";
            btn.innerText = text;
            btn.onclick = () => checkAnswer(text, word.en);
            container.appendChild(btn);
        });

        // 按鈕狀態更新
        document.getElementById('prev-btn').style.backgroundColor = (currentIndex === 0) ? "#333" : "#3498db";
    }

    function checkAnswer(selected, correct) {
        const fb = document.getElementById('feedback');
        if(selected === correct) {
            fb.innerText = "⭕ Correct!";
            fb.style.color = "#2ecc71";
            // 語音播放
            const utterance = new SpeechSynthesisUtterance(correct);
            utterance.lang = 'en-US';
            window.speechSynthesis.speak(utterance);
        } else {
            fb.innerText = "❌ Try Again!";
            fb.style.color = "#e74c3c";
        }
    }

    function changeQuestion(step) {
        currentIndex += step;
        if(currentIndex < 0) currentIndex = 0;
        if(currentIndex >= wordBank.length) currentIndex = wordBank.length - 1;
        loadQuestion();
    }

    fetchSheetData();
</script>
</body>
</html>

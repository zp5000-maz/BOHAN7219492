<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>博瀚英文單字卡 - 終極穩定版</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        body { background-color: #121212; color: white; font-family: "Microsoft JhengHei", sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { background-color: #1e1e1e; padding: 30px; border-radius: 20px; width: 90%; max-width: 500px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .image-box { border: 2px solid #3498db; border-radius: 15px; width: 100%; aspect-ratio: 16 / 10; margin: 20px 0; display: flex; justify-content: center; align-items: center; overflow: hidden; background: #252525; position: relative; }
        .image-box img { width: 100%; height: 100%; object-fit: cover; }
        .options { display: grid; gap: 12px; margin-bottom: 20px; }
        .option-btn { background-color: #333; color: white; border: 1px solid #444; padding: 15px; border-radius: 10px; cursor: pointer; font-size: 18px; }
        .nav-buttons { display: flex; justify-content: center; gap: 20px; }
        .nav-btn { background-color: #555; color: white; border: none; padding: 12px 30px; border-radius: 25px; font-size: 16px; cursor: pointer; }
        .active-btn { background-color: #3498db !important; }
        #feedback { height: 30px; margin-bottom: 10px; font-weight: bold; font-size: 20px; }
        .footer { margin-top: 30px; font-size: 12px; color: #888; border-top: 1px solid #333; padding-top: 15px; }
    </style>
</head>
<body>

<div class="container">
    <h2>博瀚英文單字卡</h2>
    <div id="loading-screen">連線至曾老師的雲端資料庫...</div>

    <div id="main-content" style="display:none;">
        <div class="image-box">
            <img id="word-image" src="" alt="單字圖">
        </div>
        <div id="options-container" class="options"></div>
        <div id="feedback"></div>
        <div class="nav-buttons">
            <button id="prev-btn" class="nav-btn" onclick="changeQuestion(-1)">上一題</button>
            <button id="next-btn" class="nav-btn active-btn" onclick="changeQuestion(1)">下一題</button>
        </div>
    </div>
    <div class="footer">博瀚文理曾益慧老師整理</div>
</div>

<script>
    // ⚠️ 請務必在此貼上您的 CSV 網址
    const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vR_JxaWoXffkQ7vVZM27GUkl8Q0H6v4zyPr9go3_1_3O3ReFeaJNWqUgk3lYLSYw8b0WALK9OwMGYgk/pub?output=csv'; 

    let wordBank = [];
    let currentIndex = 0;

    // 格式化 Unsplash 網址
    function formatImgUrl(url) {
        if (!url) return "";
        if (url.includes('unsplash.com/photos/')) {
            const id = url.split('/photos/')[1].split(/[?\/]/)[0];
            return `https://images.unsplash.com/photo-${id}?auto=format&fit=crop&w=600&h=400&q=80`;
        }
        return url;
    }

    // 使用 PapaParse 解析 CSV
    function fetchSheetData() {
        Papa.parse(csvUrl, {
            download: true,
            header: true, // 自動把第一列當成標題 (單字, 翻譯, 圖片網址)
            complete: function(results) {
                // 過濾掉空行
                wordBank = results.data.filter(item => item["單字"] && item["單字"].trim() !== "");
                
                if(wordBank.length > 0) {
                    document.getElementById('loading-screen').style.display = 'none';
                    document.getElementById('main-content').style.display = 'block';
                    loadQuestion();
                } else {
                    document.getElementById('loading-screen').innerText = '讀取成功但內容是空的，請檢查標題。';
                }
            },
            error: function() {
                document.getElementById('loading-screen').innerText = '讀取失敗。';
            }
        });
    }

    function loadQuestion() {
        const item = wordBank[currentIndex];
        const img = document.getElementById('word-image');
        const container = document.getElementById('options-container');
        const feedback = document.getElementById('feedback');
        
        feedback.innerText = "";
        container.innerHTML = "";

        // 讀取 CSV 中對應的標題欄位
        const wordEn = item["單字"].trim();
        const customImg = item["圖片網址"] || item["C"]; // 支援標題或第三欄

        img.src = formatImgUrl(customImg);

        // 產生選項
        let choices = [wordEn];
        let others = wordBank.filter(w => w["單字"] !== wordEn).map(w => w["單字"]);
        others.sort(() => Math.random() - 0.5);
        if(others[0]) choices.push(others[0]);
        if(others[1]) choices.push(others[1]);
        
        while(choices.length < 3) choices.push("練習單字");
        choices.sort(() => Math.random() - 0.5);

        choices.forEach(text => {
            const btn = document.createElement('button');
            btn.className = "option-btn";
            btn.innerText = text;
            btn.onclick = () => {
                if(text === wordEn) {
                    feedback.innerText = "⭕ Correct!";
                    feedback.style.color = "#2ecc71";
                    window.speechSynthesis.speak(new SpeechSynthesisUtterance(wordEn));
                } else {
                    feedback.innerText = "❌ Try Again!";
                    feedback.style.color = "#e74c3c";
                }
            };
            container.appendChild(btn);
        });

        document.getElementById('prev-btn').classList.toggle('active-btn', currentIndex !== 0);
    }

    function changeQuestion(step) {
        currentIndex += step;
        if(currentIndex < 0) currentIndex = 0;
        if(currentIndex >= wordBank.length) currentIndex = wordBank.length - 1;
        loadQuestion();
    }

    fetchSheetData();
</script>
</body>
</html>

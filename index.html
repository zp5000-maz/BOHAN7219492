<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>博瀚英文單字卡 - 學生登入系統</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        :root { --primary: #3498db; --bg: #121212; --card: #1e1e1e; --text: #eeeeee; }
        body { background-color: var(--bg); color: var(--text); font-family: "Microsoft JhengHei", sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { background-color: var(--card); padding: 35px; border-radius: 20px; width: 90%; max-width: 400px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid #333; }
        
        .login-form { display: flex; flex-direction: column; gap: 15px; margin-top: 25px; }
        input { background: #2a2a2a; border: 1px solid #444; color: white; padding: 14px; border-radius: 12px; font-size: 18px; text-align: center; }
        input:focus { border-color: var(--primary); outline: none; }
        
        .login-btn { background: var(--primary); color: white; border: none; padding: 14px; border-radius: 12px; cursor: pointer; font-size: 18px; font-weight: bold; transition: 0.3s; }
        .login-btn:hover { background: #2980b9; transform: translateY(-2px); }

        #quiz-app { display: none; }
        .image-box { border: 2px solid var(--primary); border-radius: 15px; width: 100%; aspect-ratio: 16 / 10; margin-bottom: 20px; overflow: hidden; background: #252525; }
        .image-box img { width: 100%; height: 100%; object-fit: cover; }
        .options { display: grid; gap: 12px; margin: 20px 0; }
        .option-btn { background: #333; color: white; border: 1px solid #444; padding: 16px; border-radius: 12px; cursor: pointer; font-size: 19px; }
        
        .footer { margin-top: 30px; font-size: 12px; color: #666; border-top: 1px solid #333; padding-top: 15px; }
    </style>
</head>
<body>

<div class="container">
    <div id="login-screen">
        <h2 style="color:var(--primary); margin-bottom:10px;">博瀚文理單字練習</h2>
        <p style="color:#aaa;">請輸入您的中文名字與密碼</p>
        <div class="login-form">
            <input type="text" id="student-login-name" placeholder="中文姓名" autocomplete="off">
            <input type="password" id="student-login-pass" placeholder="登入密碼">
            <button class="login-btn" onclick="handleLogin()">登入</button>
        </div>
        <p id="login-msg" style="color:#e74c3c; margin-top:15px; min-height:24px; font-weight:bold;"></p>
    </div>

    <div id="quiz-app">
        <div style="display:flex; justify-content:space-between; font-size:14px; color:#888; margin-bottom:15px;">
            <span id="display-name">學生：載入中</span>
            <span id="progress">1 / 1</span>
        </div>
        <div class="image-box">
            <img id="word-image" src="" alt="單字圖示">
        </div>
        <div id="options-container" class="options"></div>
        <div id="feedback" style="height:35px; font-weight:bold; font-size:24px;"></div>
        <button class="login-btn" style="background:#444; width:100%;" onclick="changeQuestion(1)">下一題</button>
    </div>

    <div class="footer">博瀚文理曾益慧老師整理</div>
</div>

<script>
    // ⚠️ 曾老師請更換這兩串 CSV 網址
    const USER_CSV = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vR_JxaWoXffkQ7vVZM27GUkl8Q0H6v4zyPr9go3_1_3O3ReFeaJNWqUgk3lYLSYw8b0WALK9OwMGYgk/pub?gid=988212355&single=true&output=csv'; 
    const WORD_CSV = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vR_JxaWoXffkQ7vVZM27GUkl8Q0H6v4zyPr9go3_1_3O3ReFeaJNWqUgk3lYLSYw8b0WALK9OwMGYgk/pub?gid=0&single=true&output=csv';    

    let userDB = [];
    let wordBank = [];
    let currentIndex = 0;

    function init() {
        Papa.parse(USER_CSV, {
            download: true, header: true, skipEmptyLines: true,
            complete: (results) => { userDB = results.data; }
        });
        Papa.parse(WORD_CSV, {
            download: true, header: true, skipEmptyLines: true,
            complete: (results) => { 
                wordBank = results.data.filter(item => item["單字"] && item["單字"].trim() !== ""); 
            }
        });
    }

    function handleLogin() {
        const nameVal = document.getElementById('student-login-name').value.trim();
        const passVal = document.getElementById('student-login-pass').value.trim();
        const msg = document.getElementById('login-msg');

        // 比對姓名欄位與密碼
        const found = userDB.find(u => u["姓名"] === nameVal && u["密碼"] === passVal);

        if (found) {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('quiz-app').style.display = 'block';
            document.getElementById('display-name').innerText = `學生：${found["姓名"]}`;
            loadQuestion();
        } else {
            msg.innerText = "❌ 找不到姓名或密碼錯誤";
        }
    }

    function loadQuestion() {
        const item = wordBank[currentIndex];
        const wordEn = item["單字"].trim();
        
        document.getElementById('progress').innerText = `${currentIndex + 1} / ${wordBank.length}`;
        document.getElementById('feedback').innerText = "";
        document.getElementById('options-container').innerHTML = "";

        // 強制轉小寫去抓 GitHub images 資料夾內的 jpg
        document.getElementById('word-image').src = `images/${wordEn.toLowerCase()}.jpg`;

        let choices = [wordEn];
        let others = wordBank.filter(w => w["單字"] !== wordEn).map(w => w["單字"]);
        others.sort(() => Math.random() - 0.5);
        if(others[0]) choices.push(others[0]);
        if(others[1]) choices.push(others[1]);
        choices.sort(() => Math.random() - 0.5);

        choices.forEach(text => {
            const btn = document.createElement('button');
            btn.className = "option-btn";
            btn.innerText = text;
            btn.onclick = () => {
                const fb = document.getElementById('feedback');
                if(text === wordEn) {
                    fb.innerText = "⭕ 正確！";
                    fb.style.color = "#2ecc71";
                    const utter = new SpeechSynthesisUtterance(wordEn);
                    utter.lang = 'en-US';
                    window.speechSynthesis.speak(utter);
                } else {
                    fb.innerText = "❌ 再試一次！";
                    fb.style.color = "#e74c3c";
                }
            };
            document.getElementById('options-container').appendChild(btn);
        });
    }

    function changeQuestion(step) {
        currentIndex = (currentIndex + step) % wordBank.length;
        loadQuestion();
    }

    init();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>博瀚英文單字卡 - 即時同步版</title>
    <style>
        body { background-color: #121212; color: white; font-family: "Microsoft JhengHei", sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { background-color: #1e1e1e; padding: 30px; border-radius: 20px; width: 90%; max-width: 500px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .image-box { border: 2px solid #3498db; border-radius: 15px; width: 100%; aspect-ratio: 16 / 10; margin: 20px 0; display: flex; justify-content: center; align-items: center; overflow: hidden; background: #252525; }
        .image-box img { width: 100%; height: 100%; object-fit: cover; }
        .options { display: grid; gap: 10px; margin-bottom: 20px; }
        .option-btn { background-color: #333; color: white; border: 1px solid #444; padding: 15px; border-radius: 10px; cursor: pointer; font-size: 18px; }
        .nav-btn { background-color: #3498db; color: white; border: none; padding: 12px 30px; border-radius: 25px; font-size: 18px; cursor: pointer; }
        .footer { margin-top: 30px; font-size: 12px; color: #888; border-top: 1px solid #333; padding-top: 15px; }
    </style>
</head>
<body>

<div class="container">
    <h2>博瀚英文單字卡</h2>
    <div id="loading">連線至博瀚雲端庫...</div>
    <div id="quiz-ui" style="display:none;">
        <div class="image-box">
            <img id="word-image" src="">
        </div>
        <div id="options" class="options"></div>
        <div id="feedback" style="height:30px; font-weight:bold;"></div>
        <div style="display:flex; justify-content:center; gap:20px;">
            <button class="nav-btn" onclick="changeQ(-1)">上一題</button>
            <button class="nav-btn" onclick="changeQ(1)">下一題</button>
        </div>
    </div>
    <div class="footer">博瀚文理曾益慧老師整理</div>
</div>

<script>
    // ⚠️ 請在此貼上您剛剛在 Apps Script 部署得到的「網頁應用程式網址」
    const apiUrl = 'https://script.google.com/macros/s/AKfycbwbcuxMnlJkAh6q8FpqS1giFPq8jQIm-L9fqskq-K6z9F3XbwIfmOGQwleGqvADAw8/exec'; 

    let wordBank = [];
    let currentIndex = 0;

    async function init() {
        try {
            const res = await fetch(apiUrl);
            wordBank = await res.json();
            if(wordBank.length > 0) {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('quiz-ui').style.display = 'block';
                showQuestion();
            }
        } catch (e) { document.getElementById('loading').innerText = '讀取失敗，請檢查 API 設定。'; }
    }

    function showQuestion() {
        const item = wordBank[currentIndex];
        const img = document.getElementById('word-image');
        const optArea = document.getElementById('options');
        
        // 確保圖片即時更新的核心：加入隨機時間戳記
        img.src = `https://images.unsplash.com/photo-1500000000000?w=500`; // 先給一個底圖
        img.src = `https://source.unsplash.com/500x350/?${item.en}&t=${new Date().getTime()}`;

        optArea.innerHTML = "";
        let choices = [item.en];
        let others = wordBank.filter(v => v.en !== item.en).sort(() => Math.random() - 0.5);
        if(others[0]) choices.push(others[0].en);
        if(others[1]) choices.push(others[1].en);
        choices.sort(() => Math.random() - 0.5);

        choices.forEach(text => {
            const btn = document.createElement('button');
            btn.className = "option-btn";
            btn.innerText = text;
            btn.onclick = () => {
                const fb = document.getElementById('feedback');
                if(text === item.en) {
                    fb.innerText = "⭕ 正確！"; fb.style.color = "#2ecc71";
                    window.speechSynthesis.speak(new SpeechSynthesisUtterance(item.en));
                } else {
                    fb.innerText = "❌ 再試試看"; fb.style.color = "#e74c3c";
                }
            };
            optArea.appendChild(btn);
        });
    }

    function changeQ(n) {
        currentIndex = (currentIndex + n + wordBank.length) % wordBank.length;
        showQuestion();
    }

    init();
</script>
</body>
</html>

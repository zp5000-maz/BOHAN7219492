<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>博瀚英文挑戰賽 - 修正版</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        :root { --primary: #3498db; --bg: #121212; --card: #1e1e1e; --text: #eeeeee; --accent: #e74c3c; }
        body { background-color: var(--bg); color: var(--text); font-family: "Microsoft JhengHei", sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { background-color: var(--card); padding: 25px; border-radius: 20px; width: 90%; max-width: 450px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        #login-logo { width: 120px; height: 120px; border-radius: 50%; border: 3px solid var(--primary); margin: 0 auto 15px auto; overflow: hidden; background: white; }
        #login-logo img { width: 100%; height: 100%; object-fit: cover; }
        .timer-container { width: 100%; height: 8px; background: #333; border-radius: 4px; margin: 15px 0; overflow: hidden; }
        #timer-bar { width: 100%; height: 100%; background: var(--primary); transition: width 1s linear; }
        .image-box { border: 2px solid var(--primary); border-radius: 15px; width: 100%; aspect-ratio: 16 / 10; margin-bottom: 15px; overflow: hidden; background: #252525; display: flex; justify-content: center; align-items: center; }
        .image-box img { width: 100%; height: 100%; object-fit: cover; }
        .text-quiz { font-size: 38px; font-weight: bold; height: 160px; display: flex; justify-content: center; align-items: center; color: white; background: #252525; border-radius: 15px; margin-bottom: 15px; border: 2px solid #444; padding: 10px; }
        .options { display: grid; gap: 10px; margin-bottom: 20px; }
        .option-btn { background: #333; color: white; border: 1px solid #444; padding: 15px; border-radius: 12px; cursor: pointer; font-size: 18px; }
        .option-btn:disabled { opacity: 0.5; }
        input { background: #2a2a2a; border: 1px solid #444; color: white; padding: 14px; border-radius: 12px; font-size: 18px; text-align: center; width: 80%; margin-bottom: 15px; }
        .btn-main { background: var(--primary); color: white; border: none; padding: 15px 30px; border-radius: 12px; cursor: pointer; font-size: 18px; font-weight: bold; }
        .footer { margin-top: 25px; font-size: 12px; color: #666; border-top: 1px solid #333; padding-top: 15px; }
    </style>
</head>
<body>

<div class="container">
    <div id="login-screen">
        <div id="login-logo"><img src="bohan_logo.jpg" alt="博瀚 logo"></div>
        <h2 style="color:var(--primary); margin-top:0;">博瀚文理單字挑戰</h2>
        <input type="text" id="username" placeholder="輸入中文姓名">
        <input type="password" id="password" placeholder="輸入密碼">
        <button class="btn-main" onclick="handleLogin()">開始測驗</button>
        <p id="login-msg" style="color:#555; font-size:14px; margin-top:10px;">資料庫連線中...</p>
    </div>

    <div id="quiz-app" style="display:none;">
        <div style="display:flex; justify-content:space-between; font-size:13px; color:#888;">
            <span id="display-info">第一關：看圖識字</span>
            <span id="display-score">得分：0</span>
        </div>
        <div class="timer-container"><div id="timer-bar"></div></div>
        <div id="img-area" class="image-box"><img id="word-image" src=""></div>
        <div id="text-area" class="text-quiz" style="display:none;"></div>
        <div id="options-container" class="options"></div>
        <div id="feedback" style="height:35px; font-weight:bold; font-size:24px;"></div>
    </div>

    <div id="result-screen" style="display:none;">
        <h2 style="color:var(--primary);">挑戰完成！</h2>
        <p id="final-score" style="font-size:28px; font-weight:bold;"></p>
        <p style="color:#2ecc71;">✅ 成績已成功上傳</p>
        <button class="btn-main" style="background:#444;" onclick="location.reload()">再測一次</button>
    </div>
    <div class="footer">博瀚文理Alice老師整理</div>
</div>

<iframe name="hidden_iframe" id="hidden_iframe" style="display:none;"></iframe>

<script>
    const USER_CSV = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vR_JxaWoXffkQ7vVZM27GUkl8Q0H6v4zyPr9go3_1_3O3ReFeaJNWqUgk3lYLSYw8b0WALK9OwMGYgk/pub?gid=988212355&single=true&output=csv'; 
    const WORD_CSV = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vR_JxaWoXffkQ7vVZM27GUkl8Q0H6v4zyPr9go3_1_3O3ReFeaJNWqUgk3lYLSYw8b0WALK9OwMGYgk/pub?gid=0&single=true&output=csv'; 
    
    // 表單設定
    const FORM_ID = '1FAIpQLSfZJgHIn20q9w1x18ZRInsM0OjDiCQMk9bsBWmfi7Rsa9rZUA';
    const ENTRY_NAME = 'entry.1809053896';
    const ENTRY_SCORE = 'entry.254641323';

    // 音效網址
    const SOUND_CORRECT = "https://www.soundjay.com/buttons/sounds/button-37.mp3";
    const SOUND_WRONG = "https://www.soundjay.com/buttons/sounds/button-10.mp3";

    let userDB = [], wordBank = [], currentStudent = "", score = 0, qCount = 0, timer = null, timeLeft = 10;

    function init() {
        Papa.parse(USER_CSV, { download: true, header: true, complete: (r) => { 
            userDB = r.data; document.getElementById('login-msg').innerText = "連線成功";
        }});
        Papa.parse(WORD_CSV, { download: true, header: true, complete: (r) => { 
            wordBank = r.data.filter(i => Object.values(i)[0]);
        }});
    }

    function playSound(src) {
        const audio = new Audio(src);
        audio.play().catch(e => console.log("音效播不出來:", e));
    }

    function handleLogin() {
        const u = document.getElementById('username').value.trim();
        const p = document.getElementById('password').value.trim();
        const found = userDB.find(row => {
            const vals = Object.values(row);
            return (vals[0] || "").trim() === u && String(vals[1] || "").trim() === p;
        });
        if (found) {
            currentStudent = u;
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('quiz-app').style.display = 'block';
            startQuestion();
        } else {
            document.getElementById('login-msg').innerText = "❌ 姓名或密碼錯誤";
        }
    }

    function startQuestion() {
        if (qCount >= 30) { finishQuiz(); return; }
        let level = Math.floor(qCount / 10) + 1;
        const item = wordBank[qCount % wordBank.length];
        const vals = Object.values(item);
        const wordEn = (vals[0] || "").trim();
        const wordZh = (vals[1] || "").trim();

        document.getElementById('display-info').innerText = `關卡 ${level} - 第 ${qCount + 1} 題`;
        const imgArea = document.getElementById('img-area');
        const textArea = document.getElementById('text-area');
        
        if (level === 1) {
            imgArea.style.display = "flex"; textArea.style.display = "none";
            document.getElementById('word-image').src = `images/${wordEn.toLowerCase()}.jpg`;
            setupOptions(wordEn, "en");
        } else if (level === 2) {
            imgArea.style.display = "none"; textArea.style.display = "flex";
            textArea.innerText = wordZh; setupOptions(wordEn, "en");
        } else {
            imgArea.style.display = "none"; textArea.style.display = "flex";
            textArea.innerText = wordEn; setupOptions(wordZh, "zh");
        }
        startTimer();
    }

    function setupOptions(correct, type) {
        const container = document.getElementById('options-container');
        container.innerHTML = "";
        let choices = [correct];
        let pool = wordBank.map(w => type === "en" ? Object.values(w)[0] : Object.values(w)[1]);
        pool = [...new Set(pool)].filter(v => v !== correct).sort(() => Math.random() - 0.5);
        if(pool[0]) choices.push(pool[0]);
        if(pool[1]) choices.push(pool[1]);
        choices.sort(() => Math.random() - 0.5);

        choices.forEach(text => {
            const btn = document.createElement('button');
            btn.className = "option-btn";
            btn.innerText = text;
            btn.onclick = () => checkAnswer(text, correct, type);
            container.appendChild(btn);
        });
    }

    function startTimer() {
        clearInterval(timer); timeLeft = 10;
        document.getElementById('timer-bar').style.width = "100%";
        timer = setInterval(() => {
            timeLeft--;
            document.getElementById('timer-bar').style.width = (timeLeft * 10) + "%";
            if (timeLeft <= 0) { clearInterval(timer); checkAnswer(null, "X"); }
        }, 1000);
    }

    function checkAnswer(selected, correct, type) {
        clearInterval(timer);
        const btns = document.querySelectorAll('.option-btn');
        btns.forEach(b => b.disabled = true);
        const fb = document.getElementById('feedback');

        if (selected === correct) {
            fb.innerText = "⭕ 正確！"; fb.style.color = "#2ecc71";
            playSound(SOUND_CORRECT);
            score++;
            document.getElementById('display-score').innerText = `得分：${score}`;
            // 語音朗讀：如果是中文字就讀中文，英文就讀英文
            let utterance = new SpeechSynthesisUtterance(correct);
            utterance.lang = (type === "zh") ? "zh-TW" : "en-US";
            window.speechSynthesis.speak(utterance);
        } else {
            fb.innerText = "❌ 答錯了！"; fb.style.color = "#e74c3c";
            playSound(SOUND_WRONG);
        }

        setTimeout(() => {
            fb.innerText = "";
            qCount++;
            startQuestion();
        }, 1200);
    }

    function finishQuiz() {
        document.getElementById('quiz-app').style.display = 'none';
        document.getElementById('result-screen').style.display = 'block';
        document.getElementById('final-score').innerText = `總得分：${score} / 30`;
        
        // 修正表單回傳方式
        const formAction = `https://docs.google.com/forms/d/e/${FORM_ID}/formResponse`;
        const postForm = document.createElement('form');
        postForm.method = 'POST';
        postForm.action = formAction;
        postForm.target = 'hidden_iframe'; // 避免頁面跳轉

        const nameInput = document.createElement('input');
        nameInput.name = ENTRY_NAME; nameInput.value = currentStudent;
        postForm.appendChild(nameInput);

        const scoreInput = document.createElement('input');
        scoreInput.name = ENTRY_SCORE; scoreInput.value = score;
        postForm.appendChild(scoreInput);

        document.body.appendChild(postForm);
        postForm.submit();
        document.body.removeChild(postForm);
    }

    init();
</script>
</body>
</html>

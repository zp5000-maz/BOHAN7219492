<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>博瀚英文單字卡 - 精準同步版</title>
    <style>
        body { background-color: #121212; color: white; font-family: "Microsoft JhengHei", sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { background-color: #1e1e1e; padding: 30px; border-radius: 20px; width: 90%; max-width: 500px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .image-box { border: 2px solid #3498db; border-radius: 15px; width: 100%; aspect-ratio: 16 / 10; margin: 20px 0; display: flex; justify-content: center; align-items: center; overflow: hidden; background: #252525; }
        .image-box img { width: 100%; height: 100%; object-fit: cover; }
        .options { display: grid; gap: 10px; margin-bottom: 20px; }
        .option-btn { background-color: #333; color: white; border: 1px solid #444; padding: 15px; border-radius: 10px; cursor: pointer; font-size: 18px; transition: 0.2s; }
        .option-btn:hover { border-color: #3498db; background: #2c3e50; }
        .nav-buttons { display: flex; justify-content: center; gap: 20px; }
        .nav-btn { background-color: #3498db; color: white; border: none; padding: 12px 30px; border-radius: 25px; font-size: 18px; cursor: pointer; min-width: 120px; }
        #feedback { height: 35px; font-weight: bold; font-size: 22px; margin-bottom: 10px; }
        .footer { margin-top: 30px; font-size: 12px; color: #888; border-top: 1px solid #333; padding-top: 15px; }
    </style>
</head>
<body>

<div class="container">
    <h2 id="level-title">博瀚英文單字卡</h2>
    <div id="loading">連線雲端資料庫中...</div>
    
    <div id="quiz-ui" style="display:none;">
        <div class="image-box">
            <img id="word-image" src="" alt="讀取中...">
        </div>
        <div id="options-container" class="options"></div>
        <div id="feedback"></div>
        <div class="nav-buttons">
            <button class="nav-btn" onclick="changeQ(-1)">上一題</button>
            <button class="nav-btn" onclick="changeQ(1)">下一題</button>
        </div>
    </div>

    <div class="footer">博瀚文理曾益慧老師整理</div>
</div>

<script>
    // ⚠️ 這裡請換成您之前部署的 Google Apps Script 網址
    const apiUrl = 'https://script.google.com/macros/s/AKfycbwbcuxMnlJkAh6q8FpqS1giFPq8jQIm-L9fqskq-K6z9F3XbwIfmOGQwleGqvADAw8/exec'; 

    let wordBank = [];
    let currentIndex = 0;

    async function init() {
        try {
            const res = await fetch(apiUrl);
            wordBank = await res.json();
            if(wordBank && wordBank.length > 0) {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('quiz-ui').style.display = 'block';
                showQuestion();
            } else {
                document.getElementById('loading').innerText = "試算表沒有資料，請檢查後再試。";
            }
        } catch (e) {
            document.getElementById('loading').innerText = "連線失敗，請檢查網址與網路。";
        }
    }

    function showQuestion() {
        const item = wordBank[currentIndex];
        const img = document.getElementById('word-image');
        const optArea = document.getElementById('options-container');
        const fb = document.getElementById('feedback');
        
        fb.innerText = "";
        optArea.innerHTML = "";

        // 改用精準度更高的圖片引擎，並加上隨機碼強制刷新
        const randomSeed = Math.floor(Math.random() * 9999);
        img.src = `https://loremflickr.com/500/350/${item.en}?lock=${randomSeed}`;

        // 選項生成邏輯：確保不會拿到重複的正確答案
        let choices = [item.en];
        
        // 從單字銀行抓取其他單字作為錯誤選項
        let others = wordBank.filter(v => v.en.toLowerCase() !== item.en.toLowerCase());
        others.sort(() => Math.random() - 0.5);

        // 至少補滿三個選項
        if(others.length >= 2) {
            choices.push(others[0].en, others[1].en);
        } else if(others.length === 1) {
            choices.push(others[0].en, "dog"); // 萬一只有兩個單字，補一個預設單字
        } else {
            choices.push("apple", "cat"); // 只有一個單字時的防呆
        }

        // 洗牌選項
        choices.sort(() => Math.random() - 0.5);

        choices.forEach(text => {
            const btn = document.createElement('button');
            btn.className = "option-btn";
            btn.innerText = text;
            btn.onclick = () => {
                if(text.toLowerCase() === item.en.toLowerCase()) {
                    fb.innerText = "⭕ 正確！Excellent!";
                    fb.style.color = "#2ecc71";
                    // 語音播放
                    const msg = new SpeechSynthesisUtterance(item.en);
                    msg.lang = 'en-US';
                    window.speechSynthesis.speak(msg);
                } else {
                    fb.innerText = "❌ 再試一下喔！";
                    fb.style.color = "#e74c3c";
                }
            };
            optArea.appendChild(btn);
        });
    }

    function changeQ(n) {
        // 更新題號，並確保在範圍內循環
        currentIndex += n;
        if(currentIndex < 0) currentIndex = wordBank.length - 1;
        if(currentIndex >= wordBank.length) currentIndex = 0;
        showQuestion();
    }

    init();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>博瀚英文挑戰賽 - 曾老師正式版</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        :root { --p: #3498db; --bg: #121212; --c: #1e1e1e; --t: #eee; --a: #e74c3c; }
        body { background: var(--bg); color: var(--t); font-family: "Microsoft JhengHei", sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { background: var(--c); padding: 25px; border-radius: 20px; width: 90%; max-width: 450px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        #login-logo { width: 100px; height: 100px; border-radius: 50%; border: 3px solid var(--p); margin: 0 auto 15px; background: white; overflow: hidden; }
        #login-logo img { width: 100%; height: 100%; object-fit: cover; }
        .timer-bar { width: 100%; height: 8px; background: #333; border-radius: 4px; margin: 15px 0; overflow: hidden; }
        #progress { width: 100%; height: 100%; background: var(--p); transition: width 1s linear; }
        .q-box { font-size: 36px; font-weight: bold; min-height: 140px; display: flex; justify-content: center; align-items: center; background: #252525; border-radius: 15px; margin-bottom: 15px; border: 2px solid #444; padding: 15px; color: white; }
        .img-box { width: 100%; aspect-ratio: 16/10; margin-bottom: 15px; border-radius: 15px; overflow: hidden; display: none; border: 2px solid var(--p); }
        .img-box img { width: 100%; height: 100%; object-fit: cover; }
        .options { display: grid; gap: 10px; }
        .btn { background: #333; color: white; border: 1px solid #444; padding: 16px; border-radius: 12px; font-size: 19px; cursor: pointer; transition: 0.2s; }
        .btn:active { background: var(--p); }
        input { background: #2a2a2a; border: 1px solid #444; color: white; padding: 14px; border-radius: 10px; width: 85%; margin-bottom: 12px; font-size: 18px; text-align: center; }
        .main-btn { background: var(--p); color: white; border: none; padding: 15px 40px; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 18px; }
        #fb { height: 35px; margin-top: 10px; font-weight: bold; font-size: 24px; }
        .footer { margin-top: 25px; font-size: 12px; color: #666; border-top: 1px solid #333; padding-top: 15px; }
    </style>
</head>
<body>

<div class="container">
    <div id="sc-login">
        <div id="login-logo"><img src="bohan_logo.jpg"></div>
        <h2 style="color:var(--p)">博瀚單字挑戰</h2>
        <input type="text" id="u" placeholder="學生中文姓名">
        <input type="password" id="p" placeholder="登入密碼">
        <br>
        <button class="main-btn" onclick="login()">開始測驗</button>
        <p id="msg" style="color:#777; font-size:14px; margin-top:10px;">資料庫連線中...</p>
    </div>

    <div id="sc-quiz" style="display:none">
        <div style="display:flex; justify-content:space-between; font-size:13px; color:#888;">
            <span id="info">載入中...</span><span id="score">得分: 0</span>
        </div>
        <div class="timer-bar"><div id="progress"></div></div>
        <div id="img-q" class="img-box"><img id="q-img" src=""></div>
        <div id="text-q" class="q-box"></div>
        <div id="opts" class="options"></div>
        <div id="fb"></div>
    </div>

    <div id="sc-res" style="display:none">
        <h2 style="color:var(--p)">測驗完成！</h2>
        <p id="total" style="font-size:28px; font-weight:bold;"></p>
        <p id="status" style="color:#f39c12; font-weight:bold;">⏳ 成績同步中...</p>
        <button class="main-btn" onclick="location.reload()">重新挑戰</button>
    </div>
    <div class="footer">博瀚文理ALICE老師整理</div>
</div>

<script>
    // 曾老師：網址已為您寫死，直接使用即可
    const U_CSV = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vR_JxaWoXffkQ7vVZM27GUkl8Q0H6v4zyPr9go3_1_3O3ReFeaJNWqUgk3lYLSYw8b0WALK9OwMGYgk/pub?gid=988212355&single=true&output=csv'; 
    const W_CSV = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vR_JxaWoXffkQ7vVZM27GUkl8Q0H6v4zyPr9go3_1_3O3ReFeaJNWqUgk3lYLSYw8b0WALK9OwMGYgk/pub?gid=0&single=true&output=csv';
    const FORM_ACTION = 'https://docs.google.com/forms/d/e/1FAIpQLSfZJgHIn20q9w1x18ZRInsM0OjDiCQMk9bsBWmfi7Rsa9rZUA/formResponse';
    const E_NAME = 'entry.1809053896';
    const E_SCORE = 'entry.254641323';

    let db_u = [], db_w = [], cur_u = "", cur_s = 0, cur_q = 0, timer, time = 10;

    function init() {
        Papa.parse(U_CSV, { download: true, complete: (r) => { 
            db_u = r.data.filter(row => row[0] && row[0] !== "姓名"); // 過濾掉標題
            document.getElementById('msg').innerText = "系統就緒，請登入";
        }});
        Papa.parse(W_CSV, { download: true, complete: (r) => { 
            db_w = r.data.filter(row => row[0] && row[0] !== "單字"); // 過濾掉標題
        }});
    }

    function speak(txt, lang) {
        window.speechSynthesis.cancel(); // 停止之前的朗讀
        const s = new SpeechSynthesisUtterance(txt);
        s.lang = lang;
        s.rate = 0.9;
        window.speechSynthesis.speak(s);
    }

    function login() {
        const user = document.getElementById('u').value.trim();
        const pass = document.getElementById('p').value.trim();
        const found = db_u.find(r => (r[0]||"").trim() === user && String(r[1]||"").trim() === pass);
        if (found) {
            cur_u = user;
            document.getElementById('sc-login').style.display = 'none';
            document.getElementById('sc-quiz').style.display = 'block';
            nextQ();
        } else { document.getElementById('msg').innerText = "❌ 姓名或密碼錯誤"; document.getElementById('msg').style.color = "#e74c3c"; }
    }

    function nextQ() {
        if (cur_q >= 30) { end(); return; }
        let lv = Math.floor(cur_q / 10) + 1;
        let item = db_w[cur_q % db_w.length];
        let en = String(item[0] || "").trim();
        let zh = String(item[1] || "").trim();
        
        document.getElementById('info').innerText = `關卡 ${lv}/3 - 第 ${cur_q+1} 題`;
        const tQ = document.getElementById('text-q'), iQ = document.getElementById('img-q');

        if (lv === 1) { // 看圖
            iQ.style.display = "block"; tQ.style.display = "none";
            document.getElementById('q-img').src = `images/${en.toLowerCase()}.jpg`;
            build(en, "en");
        } else if (lv === 2) { // 中翻英
            iQ.style.display = "none"; tQ.style.display = "flex";
            tQ.innerText = zh; speak(zh, "zh-TW"); build(en, "en");
        } else { // 英翻中
            iQ.style.display = "none"; tQ.style.display = "flex";
            tQ.innerText = en; speak(en, "en-US"); build(zh, "zh");
        }
        startT();
    }

    function build(ans, type) {
        const container = document.getElementById('opts');
        container.innerHTML = "";
        let pool = db_w.map(w => type === "en" ? w[0] : w[1]).filter(v => v && v !== ans);
        let choices = [ans, ...pool.sort(() => 0.5 - Math.random()).slice(0, 2)].sort(() => 0.5 - Math.random());
        choices.forEach(txt => {
            const b = document.createElement('button');
            b.className = "btn"; b.innerText = txt;
            b.onclick = () => check(txt, ans, type);
            container.appendChild(b);
        });
    }

    function startT() {
        clearInterval(timer); time = 10;
        document.getElementById('progress').style.width = "100%";
        timer = setInterval(() => {
            time--;
            document.getElementById('progress').style.width = (time * 10) + "%";
            if (time <= 0) { clearInterval(timer); check(null, "TIMEOUT", ""); }
        }, 1000);
    }

    function check(sel, ans, type) {
        clearInterval(timer);
        const f = document.getElementById('fb');
        document.querySelectorAll('.btn').forEach(b => b.disabled = true);
        if (sel === ans) {
            f.innerText = "⭕ Correct!"; f.style.color = "#2ecc71";
            new Audio("https://assets.mixkit.co/active_storage/sfx/2013/2013-preview.mp3").play();
            cur_s++;
            document.getElementById('score').innerText = `得分: ${cur_s}`;
            setTimeout(() => speak(ans, type === "zh" ? "zh-TW" : "en-US"), 200);
        } else {
            f.innerText = "❌ Incorrect!"; f.style.color = "#e74c3c";
            new Audio("https://assets.mixkit.co/active_storage/sfx/2018/2018-preview.mp3").play();
        }
        setTimeout(() => { f.innerText = ""; cur_q++; nextQ(); }, 1600);
    }

    function end() {
        document.getElementById('sc-quiz').style.display = 'none';
        document.getElementById('sc-res').style.display = 'block';
        document.getElementById('total').innerText = `總得分：${cur_s} / 30`;
        
        // 終極回傳：同時使用三種方式，確保成功
        const params = `${E_NAME}=${encodeURIComponent(cur_u)}&${E_SCORE}=${cur_s}&submit=Submit`;
        const fullUrl = `${FORM_ACTION}?${params}`;
        
        // 1. Beacon API (最現代)
        if (navigator.sendBeacon) navigator.sendBeacon(fullUrl);
        
        // 2. Image Image (最暴力)
        const img = new Image(); img.src = fullUrl;
        
        // 3. Hidden Iframe (最傳統)
        const ifr = document.createElement('iframe');
        ifr.src = fullUrl; ifr.style.display = 'none';
        document.body.appendChild(ifr);

        setTimeout(() => {
            document.getElementById('status').innerText = "✅ 成績已成功存入試算表";
            document.getElementById('status').style.color = "#2ecc71";
        }, 2500);
    }
    init();
</script>
</body>
</html>

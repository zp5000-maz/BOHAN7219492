<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>博瀚英文單字卡 - 曾老師修正版</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        :root { --primary: #3498db; --bg: #121212; --card: #1e1e1e; --text: #eeeeee; }
        body { background-color: var(--bg); color: var(--text); font-family: "Microsoft JhengHei", sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { background-color: var(--card); padding: 25px; border-radius: 20px; width: 90%; max-width: 450px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .image-box { border: 2px solid var(--primary); border-radius: 15px; width: 100%; aspect-ratio: 16 / 10; margin-bottom: 20px; display: flex; justify-content: center; align-items: center; overflow: hidden; background: #252525; }
        .image-box img { width: 100%; height: 100%; object-fit: cover; }
        .options { display: grid; gap: 12px; margin-bottom: 20px; }
        .option-btn { background-color: #333; color: white; border: 1px solid #444; padding: 15px; border-radius: 12px; cursor: pointer; font-size: 18px; }
        #feedback { height: 35px; margin-bottom: 15px; font-weight: bold; font-size: 24px; }
        .nav-btn { background-color: #444; color: white; border: none; padding: 12px 25px; border-radius: 25px; cursor: pointer; min-width: 100px; }
        .active-nav { background-color: var(--primary); }
        .footer { margin-top: 25px; font-size: 12px; color: #666; border-top: 1px solid #333; padding-top: 15px; }
    </style>
</head>
<body>

<div class="container">
    <div id="loading-screen">連線至博瀚資料庫...</div>
    <div id="main-content" style="display:none;">
        <div style="display:flex; justify-content:space-between; color:#888; font-size:14px; margin-bottom:10px;">
            <span id="mode-text">第一關：看圖識字</span>
            <span id="progress-text">1 / 1</span>
        </div>
        <h2 style="color:var(--primary); margin-top:0;">博瀚英文單字卡測驗系統</h2>
        <div class="image-box">
            <img id="word-image" src="" alt="題目圖片">
        </div>
        <div id="options-container" class="options"></div>
        <div id="feedback"></div>
        <div style="display:flex; justify-content:center; gap:15px;">
            <button id="prev-btn" class="nav-btn" onclick="changeQuestion(-1)">上一題</button>
            <button id="next-btn" class="nav-btn active-nav" onclick="changeQuestion(1)">下一題</button>
        </div>
    </div>
    <div class="footer">博瀚文理曾益慧老師整理</div>
</div>

<script>
    // ⚠️ 曾老師，請確認您的 CSV 網址包含「單字」與「翻譯」這兩欄
    const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vR_JxaWoXffkQ7vVZM27GUkl8Q0H6v4zyPr9go3_1_3O3ReFeaJNWqUgk3lYLSYw8b0WALK9OwMGYgk/pub?output=csv'; 

    let wordBank = [];
    let currentIndex = 0;

    function fetchSheetData() {
        Papa.parse(csvUrl, {
            download: true,
            header: true,
            skipEmptyLines: true,
            complete: function(results) {
                // 修正：只保留有單字的列，避免讀取到試算表下方的空白或亂碼
                wordBank = results.data.filter(item => item["單字"] && item["單字"].trim().length > 0 && item["單字"].length < 20);
                if(wordBank.length > 0) {
                    document.getElementById('loading-screen').style.display = 'none';
                    document.getElementById('main-content').style.display = 'block';
                    loadQuestion();
                }
            }
        });
    }

    function loadQuestion() {
        const item = wordBank[currentIndex];
        const wordEn = item["單字"].trim();
        
        document.getElementById('progress-text').innerText = `${currentIndex + 1} / ${wordBank.length}`;
        document.getElementById('feedback').innerText = "";
        document.getElementById('options-container').innerHTML = "";

        // ★ 修正重點：路徑改為 images/，並強制轉小寫以匹配檔案
        const imgElement = document.getElementById('word-image');
        const fileName = wordEn.toLowerCase(); 
        imgElement.src = `images/${fileName}.jpg`; 

        // 產生選項
        let choices = [wordEn];
        let others = wordBank.filter(w => w["單字"] !== wordEn).map(w => w["單字"]);
        others.sort(() => Math.random() - 0.5);
        if(others[0]) choices.push(others[0]);
        if(others[1]) choices.push(others[1]);
        choices.sort(() => Math.random() - 0.5);

        choices.forEach(text => {
            const btn = document.createElement('button');
            btn.className = "option-btn";
            btn.innerText = text;
            btn.onclick = () => {
                const fb = document.getElementById('feedback');
                if(text === wordEn) {
                    fb.innerText = "⭕ 正確！";
                    fb.style.color = "#2ecc71";
                    window.speechSynthesis.speak(new SpeechSynthesisUtterance(wordEn));
                } else {
                    fb.innerText = "❌ 再試一次！";
                    fb.style.color = "#e74c3c";
                }
            };
            document.getElementById('options-container').appendChild(btn);
        });
    }

    function changeQuestion(step) {
        currentIndex += step;
        if (currentIndex < 0) currentIndex = 0;
        if (currentIndex >= wordBank.length) currentIndex = 0;
        loadQuestion();
    }

    fetchSheetData();
</script>
</body>
</html>

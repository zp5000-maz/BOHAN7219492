<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>博瀚英文單字卡 - 曾老師完整版</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        :root { --primary: #3498db; --bg: #121212; --card: #1e1e1e; --text: #eeeeee; }
        body { background-color: var(--bg); color: var(--text); font-family: "Microsoft JhengHei", sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { background-color: var(--card); padding: 25px; border-radius: 20px; width: 90%; max-width: 450px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .info-bar { display: flex; justify-content: space-between; font-size: 14px; color: #888; margin-bottom: 10px; }
        h2 { margin: 0 0 15px 0; font-weight: normal; color: var(--primary); font-size: 22px; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .image-box { border: 2px solid var(--primary); border-radius: 15px; width: 100%; aspect-ratio: 16 / 10; margin-bottom: 20px; display: flex; justify-content: center; align-items: center; overflow: hidden; background: #252525; }
        .image-box img { width: 100%; height: 100%; object-fit: cover; }
        .question-text { font-size: 40px; font-weight: bold; margin: 40px 0; min-height: 60px; color: white; display: flex; justify-content: center; align-items: center; }
        .options { display: grid; gap: 12px; margin-bottom: 20px; }
        .option-btn { background-color: #333; color: white; border: 1px solid #444; padding: 15px; border-radius: 12px; cursor: pointer; font-size: 18px; transition: 0.2s; }
        .option-btn:hover { border-color: var(--primary); background: #252525; }
        #feedback { height: 30px; margin-bottom: 15px; font-weight: bold; font-size: 22px; }
        .nav-buttons { display: flex; justify-content: center; gap: 15px; }
        .nav-btn { background-color: #444; color: white; border: none; padding: 12px 25px; border-radius: 25px; font-size: 16px; cursor: pointer; min-width: 100px; }
        .active-nav { background-color: var(--primary); }
        .footer { margin-top: 25px; font-size: 12px; color: #666; border-top: 1px solid #333; padding-top: 15px; }
    </style>
</head>
<body>

<div class="container">
    <div id="loading-screen">連線中...</div>
    <div id="main-content" style="display:none;">
        <div class="info-bar">
            <span id="mode-text">模式：看圖識字</span>
            <span id="progress-text">1 / 1</span>
        </div>
        <h2>博瀚英文單字卡</h2>
        <div id="quiz-display">
            <div id="img-container" class="image-box">
                <img id="word-image" src="" alt="題目圖片">
            </div>
            <div id="text-container" class="question-text" style="display:none;"></div>
        </div>
        <div id="options-container" class="options"></div>
        <div id="feedback"></div>
        <div class="nav-buttons">
            <button id="prev-btn" class="nav-btn" onclick="changeQuestion(-1)">上一題</button>
            <button id="next-btn" class="nav-btn active-nav" onclick="changeQuestion(1)">下一題</button>
        </div>
    </div>
    <div class="footer">博瀚文理曾益慧老師整理</div>
</div>

<script>
    // ⚠️ 老師請記得在這裡填入您的 CSV 網址
    const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vR_JxaWoXffkQ7vVZM27GUkl8Q0H6v4zyPr9go3_1_3O3ReFeaJNWqUgk3lYLSYw8b0WALK9OwMGYgk/pub?output=csv'; 

    let wordBank = [];
    let currentIndex = 0;
    let currentMode = 1;

    function getStableImgUrl(item) {
        let url = item["圖片網址"] ? item["圖片網址"].trim() : "";
        let word = item["單字"].trim();
        
        // 修正 Unsplash 網址處理
        if (url.includes('unsplash.com/photos/')) {
            const parts = url.split('/');
            const id = parts[parts.length - 1].split(/[?#]/)[0];
            return `https://images.unsplash.com/photo-${id}?auto=format&fit=crop&w=500&h=350&q=80`;
        }
        
        // 如果沒給網址，針對 happy, run 等單字自動匹配圖片
        return `https://loremflickr.com/500/350/${word}?lock=${word.length}`;
    }

    function fetchSheetData() {
        Papa.parse(csvUrl, {
            download: true,
            header: true,
            complete: function(results) {
                wordBank = results.data.filter(item => item["單字"] && item["單字"].trim().length > 0);
                if(wordBank.length > 0) {
                    document.getElementById('loading-screen').style.display = 'none';
                    document.getElementById('main-content').style.display = 'block';
                    loadQuestion();
                }
            }
        });
    }

    function loadQuestion() {
        const item = wordBank[currentIndex];
        const wordEn = item["單字"].trim();
        const wordZh = item["翻譯"] ? item["翻譯"].trim() : "翻譯載入中";
        
        document.getElementById('progress-text').innerText = `${currentIndex + 1} / ${wordBank.length}`;
        document.getElementById('feedback').innerText = "";
        document.getElementById('options-container').innerHTML = "";

        const imgContainer = document.getElementById('img-container');
        const textContainer = document.getElementById('text-container');
        const imgElement = document.getElementById('word-image');

        if (currentMode === 1) {
            document.getElementById('mode-text').innerText = "第一關：看圖識字";
            imgContainer.style.display = "flex";
            textContainer.style.display = "none";
            imgElement.src = getStableImgUrl(item);
            setupOptions(wordEn, "en");
        } else if (currentMode === 2) {
            document.getElementById('mode-text').innerText = "第二關：中翻英";
            imgContainer.style.display = "none";
            textContainer.style.display = "flex";
            textContainer.innerText = wordZh;
            setupOptions(wordEn, "en");
        } else {
            document.getElementById('mode-text').innerText = "第三關：英翻中";
            imgContainer.style.display = "none";
            textContainer.style.display = "flex";
            textContainer.innerText = wordEn;
            setupOptions(wordZh, "zh");
        }
    }

    function setupOptions(correctAnswer, type) {
        let choices = [correctAnswer];
        let others = wordBank.filter(w => {
            let val = (type === "en") ? w["單字"].trim() : (w["翻譯"] ? w["翻譯"].trim() : "");
            return val !== correctAnswer;
        }).map(w => (type === "en") ? w["單字"].trim() : (w["翻譯"] ? w["翻譯"].trim() : ""));

        others.sort(() => 0.5 - Math.random());
        if(others[0]) choices.push(others[0]);
        if(others[1]) choices.push(others[1]);
        while(choices.length < 3) choices.push("Next Word");
        choices.sort(() => 0.5 - Math.random());

        choices.forEach(text => {
            const btn = document.createElement('button');
            btn.className = "option-btn";
            btn.innerText = text;
            btn.onclick = () => {
                const fb = document.getElementById('feedback');
                if(text === correctAnswer) {
                    fb.innerText = "⭕ Excellent!";
                    fb.style.color = "#2ecc71";
                    // 答對就讀英文發音
                    const utter = new SpeechSynthesisUtterance(wordBank[currentIndex]["單字"]);
                    window.speechSynthesis.speak(utter);
                } else {
                    fb.innerText = "❌ Try Again!";
                    fb.style.color = "#e74c3c";
                }
            };
            document.getElementById('options-container').appendChild(btn);
        });
    }

    function changeQuestion(step) {
        currentIndex += step;
        if (currentIndex >= wordBank.length) {
            currentIndex = 0;
            currentMode = (currentMode % 3) + 1;
            alert(`恭喜！進入 ${document.getElementById('mode-text').innerText}`);
        } else if (currentIndex < 0) {
            currentIndex = 0;
        }
        loadQuestion();
    }

    fetchSheetData();
</script>
</body>
</html>
